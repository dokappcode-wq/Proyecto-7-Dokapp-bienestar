# Render Blueprint: crea la base de datos y el servidor de Dokapp ya conectados.
# En Render: New → Blueprint → elige este repositorio → Apply.
databases:
  - name: dokapp-db
    plan: free
    region: frankfurt
    postgresMajorVersion: "16"

services:
  - type: web
    name: dokapp-bienestar
    runtime: node
    plan: free
    region: frankfurt
    buildCommand: npm ci --include=dev && npm run build:server
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"
      - key: DATABASE_URL
        fromDatabase:
          name: dokapp-db
          property: connectionString
